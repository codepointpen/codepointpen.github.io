<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Gallery - Lightbox</title>

  <link rel="stylesheet" href="lightboxStyle.css">

</head>
<body>
  
  <nav class="nav">
    <a>Home</a>
    <a class="active">Art</a>
  </nav>

  <button class="dark-mode-toggle" id="darkModeToggle">
    🌙
  </button>

  <div class="art-page">
    <header class="art-header">
      <h1>Visual Work</h1>
      <p>Click any artwork to view fullscreen</p>
    </header>

    <div class="gallery-container">
      <div class="gallery-grid" id="galleryGrid">
      </div>
    </div>
  </div>

  <div class="lightbox hidden" id="lightbox">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose">×</button>
      <img id="lightboxImage" src="" alt="">
      <div class="lightbox-info">
        <h2 class="lightbox-title" id="lightboxTitle"></h2>
        <p class="lightbox-desc" id="lightboxDesc"></p>
      </div>
    </div>
  </div>

  <script src="data/artData.js"></script>

  <script>
    const toggleButton = document.getElementById('darkModeToggle');
    const body = document.body;
    
    const savedDarkMode = localStorage.getItem('darkMode');
    if (savedDarkMode === 'enabled') {
      body.classList.add('dark');
      toggleButton.textContent = '☀️';
    }
    
    toggleButton.addEventListener('click', function() {
      body.classList.toggle('dark');
      const isDarkMode = body.classList.contains('dark');
      toggleButton.textContent = isDarkMode ? '☀️' : '🌙';
      localStorage.setItem('darkMode', isDarkMode ? 'enabled' : 'disabled');
    });

    const galleryGrid = document.getElementById('galleryGrid');
    
    function renderGallery() {
      galleryGrid.innerHTML = '';
      
      artworks.forEach(artwork => {
        const card = document.createElement('div');
        card.className = 'art-card';
        
        card.innerHTML = `
          <img src="${artwork.imageUrl}" alt="${artwork.title}">
          <div class="art-info">
            <h3>${artwork.title}</h3>
            <p>${artwork.description}</p>
          </div>
        `;
        
        card.addEventListener('click', function() {
          openLightbox(artwork);
        });
        
        galleryGrid.appendChild(card);
      });
    }
    
    renderGallery();

    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxDesc = document.getElementById('lightboxDesc');
    const lightboxClose = document.getElementById('lightboxClose');

    function openLightbox(artwork) {
      lightboxImage.src = artwork.imageUrl;
      lightboxImage.alt = artwork.title;
      lightboxTitle.textContent = artwork.title;
      lightboxDesc.textContent = `${artwork.description} • ${artwork.year}`;
      
      lightbox.classList.remove('hidden');
      
      body.classList.add('no-scroll');
      
      console.log('Opened lightbox for:', artwork.title);
    }

    function closeLightbox() {
      lightbox.classList.add('hidden');
      
      body.classList.remove('no-scroll');
      
      console.log('Closed lightbox');
    }

    lightboxClose.addEventListener('click', function(e) {
      e.stopPropagation();
      closeLightbox();
    });

    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' || e.key === 'Esc') {
        if (!lightbox.classList.contains('hidden')) {
          closeLightbox();
        }
      }
    });

  </script>

</body>
</html>
