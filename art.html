<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Artwork</title>
  
  <link rel="stylesheet" href="artStyle.css">
  
</head>
<body>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a class="active">Art</a>
  </nav>

  <button class="dark-mode-toggle" id="darkModeToggle">
    🌙
  </button>

  <header class="art-header">
    <h1>Visual Work</h1>
    <p>Digital Art Portfolio</p>
  </header>

  <div class="filter-container">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="tag 1">Tag 1</button>
    <button class="filter-btn" data-filter="tag 2">Tag 2</button>
    <button class="filter-btn" data-filter="tag 3">Tag 3</button>
  </div>

  <div class="gallery-container">
    <div class="gallery-grid" id="galleryGrid">
    </div>
  </div>

  <script src="data/artData.js"></script>

  <script>
    const toggleButton = document.getElementById('darkModeToggle');
    const body = document.body;
    
    const savedDarkMode = localStorage.getItem('darkMode');
    if (savedDarkMode === 'enabled') {
      body.classList.add('dark');
      toggleButton.textContent = '☀️';
    }
    
    toggleButton.addEventListener('click', function() {
      body.classList.toggle('dark');
      const isDarkMode = body.classList.contains('dark');
      toggleButton.textContent = isDarkMode ? '☀️' : '🌙';
      localStorage.setItem('darkMode', isDarkMode ? 'enabled' : 'disabled');
    });

    const galleryGrid = document.getElementById('galleryGrid');
    
    function renderGallery(artworksToShow) {
      galleryGrid.innerHTML = '';
      
      artworksToShow.forEach((artwork, index) => {
        const card = document.createElement('div');
        card.className = 'art-card fade-in';
        card.dataset.category = artwork.category;
        
        card.style.animationDelay = `${index * 0.1}s`;
        
        card.innerHTML = `
          <img src="${artwork.imageUrl}" alt="${artwork.title}">
          <div class="art-info">
            <h3>${artwork.title}</h3>
            <p>${artwork.description}</p>
            <span class="art-category">${artwork.category}</span>
          </div>
        `;
        
        galleryGrid.appendChild(card);
      });
    }

        console.log(`Showing ${filteredArtworks.length} artworks in category: ${filterValue}`);

    });

  </script>

</body>
</html>
