<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hao hu</title>

    <link rel="stylesheet" href="style.css">
  
</head>
<body>
    <nav class="nav" id="mainNav">
        <a href="#about">about</a>
        <a href="#projects">work</a>
        <a href="#art">art</a>
        <a href="#contact">contact</a>
    </nav>
    <button class="dark-mode-toggle" id="darkModeToggle">
        🌙
    </button>
    <section class="intro">
        <h1>Hao Hu</h1>
        <p>developer × digital artist</p>
    </section>

    <section class="about" id="about">
        <div class="container">
            <h2>about</h2>
            <p>lalala this is a template</p>
        </div>
    </section>

    <section class="projects" id="projects">
        <div class="container">
            <h2>Projects</h2>

            <div class="projects-grid">
                <article class="project">
                    <h3>Project 1</h3>
                    <p>placeholder</p>
                </article>

                <article class="project">
                    <h3>Project 2</h3>
                    <p>placeholder</p>
                </article>

                <article class="project">
                    <h3>Project 3</h3>
                    <p>placeholder</p>
                </article>
            </div>
        </div>
    </section>

    <section class="contact" id="contact">
        <div class="container">
            <h2>Get in Touch</h2>
            <p>lalala placeholder</p>
        </div>
    </section>

    <script>
        const DarkModeToggle = ({ isDark, toggle }) => {
            return (
                <button
                onClick={toggle}
                className="dark-mode-toggle"
                title={isDark ? "Switch to light mode" : "Switch to dark mode"}
                >
                {isDark ? '☀️' : '🌙'}
                </button>
            );
        };

        const Navigation = ({ currentPage, setCurrentPage }) => {
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                setIsScrolled(window.scrollY > 50);
                };

                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (sectionId) => {
                const element = document.getElementById(sectionId);
                if (element) {
                element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <nav className={`nav ${isScrolled ? 'nav-scrolled' : ''}`}>
                {currentPage === 'home' ? (
                    <>
                    <a onClick={() => scrollToSection('about')} className={currentPage === 'home' ? 'active' : ''}>About</a>
                    <a onClick={() => scrollToSection('projects')} className={currentPage === 'home' ? 'active' : ''}>Work</a>
                    <a onClick={() => setCurrentPage('art')}>Art</a>
                    </>
                ) : (
                    <>
                    <a onClick={() => setCurrentPage('home')}>Home</a>
                    <a className="active">Art</a>
                    </>
                )}
                </nav>
            );
        };


        const App = () => {
            const [isDark, setIsDark] = useState(false);
            const [currentPage, setCurrentPage] = useState('home');

            const toggleDarkMode = () => {
                setIsDark(!isDark);
                document.body.classList.toggle('dark');
            };

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [currentPage]);

            return (
                <div className="canvas">
                <DarkModeToggle isDark={isDark} toggle={toggleDarkMode} />
                <Navigation currentPage={currentPage} setCurrentPage={setCurrentPage} />
                
                {currentPage === 'home' ? (
                    <>
                    <Info />
                    <About />
                    <Projects />
                    </>
                ) : (
                    <ArtPage />
                )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
    </script>

</body>
</html>
