<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hao hu</title>

    <link rel="stylesheet" href="style.css">
  
</head>
<body>

    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="data/artData.js"></script>
    <script src="data/projectData.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DarkModeToggle = ({ isDark, toggle }) => {
            return (
                <button
                onClick={toggle}
                className="dark-mode-toggle"
                title={isDark ? "Switch to light mode" : "Switch to dark mode"}
                >
                {isDark ? '☀️' : '🌙'}
                </button>
            );
        };

        const Navigation = ({ currentPage, setCurrentPage }) => {
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                setIsScrolled(window.scrollY > 50);
                };

                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (sectionId) => {
                const element = document.getElementById(sectionId);
                if (element) {
                element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <nav className={`nav ${isScrolled ? 'nav-scrolled' : ''}`}>
                {currentPage === 'home' ? (
                    <>
                    <a onClick={() => scrollToSection('about')} className={currentPage === 'home' ? 'active' : ''}>About</a>
                    <a onClick={() => scrollToSection('projects')} className={currentPage === 'home' ? 'active' : ''}>Work</a>
                    <a onClick={() => setCurrentPage('art')}>Art</a>
                    <a onClick={() => scrollToSection('contact')} className={currentPage === 'home' ? 'active' : ''}>Contact</a>
                    </>
                ) : (
                    <>
                    <a onClick={() => setCurrentPage('home')}>Home</a>
                    <a className="active">Art</a>
                    </>
                )}
                </nav>
            );
        };

        const Info = () => {
            return (
                <section className="info">
                <div className="scrap scrap-1"></div>
                <div className="scrap scrap-2"></div>
                <div className="scrap scrap-3"></div>
                
                <div className="info-content">
                    <h1 className="name">
                    <span className="first-name">Hao</span>
                    <span className="last-name">Hu</span>
                    </h1>
                    <p className="tagline">Developer × Digital Artist</p>
                </div>
                </section>
            );
        };

        const About = () => {
            return (
                <section id="about" className="about">
                <div className="tape tape-1"></div>
                
                <div className="about-grid">
                    <div>
                    <div className="section-label">About</div>
                    </div>
                    <div className="about-text">
                    <p>placeholder</p>
                    <p>placeholder</p>
                    </div>
                </div>
                
                <div className="tape tape-2"></div>
                </section>
            );
        };

        const ProjectCard = ({ project, onClick }) => {
            return (
                <article className="project-item" onClick={() => onClick(project)}>
                <div className="project-number">{project.number}</div>
                <h3 className="project-title">{project.title}</h3>
                <p className="project-description">{project.description}</p>
                <div className="project-tags">
                    {project.tags.map((tag, index) => (
                    <span key={index} className="project-tag">{tag}</span>
                    ))}
                </div>
                </article>
            );
        };

        const ProjectDetail = ({ project, onClose }) => {
            const [visible, setVisible] = React.useState(false);

            useEffect(() => {
                document.body.style.overflow = 'hidden';
                setVisible(true);
                return () => {
                document.body.style.overflow = 'unset';
                };
            }, []);

            const handleClose = () => {
                setVisible(false);
                setTimeout(onClose, 300); 
            };

            return (
                <div 
                className={`project-lightbox ${visible ? 'visible' : ''}`} 
                onClick={handleClose}
                >
                <div className="project-lightbox-content" onClick={(e) => e.stopPropagation()}>
                    <button className="lightbox-close" onClick={handleClose}>×</button>
                    <h1 className="project-detail-title">{project.title}</h1>
                    <p className="project-detail-description">{project.description}</p>
                    <div className="project-detail-tags">
                    {project.tags.map((tag, i) => (
                        <span key={i} className="project-tag">{tag}</span>
                    ))}
                    </div>
                </div>
                </div>
            );
        };

        const Projects = () => {
            const [selectedProject, setSelectedProject] = useState(null);

            return (
                <section id="projects" className="projects">
                <div className="projects-container">
                    <h2 className="section-title">Selected Work</h2>

                    <div className="annotation annotation-1">in progress →</div>

                    <div className="projects-collage">
                    {projectsData.map((project) => (
                        <ProjectCard
                        key={project.id}
                        project={project}
                        onClick={setSelectedProject} 
                        />
                    ))}
                    </div>
                </div>

                {selectedProject && (
                    <ProjectDetail project={selectedProject} onClose={() => setSelectedProject(null)} />
                )}
                </section>
            );
        };


        const ArtPage = () => {
            const [filter, setFilter] = useState('all');
            const [selectedArt, setSelectedArt] = useState(null);

            const filteredArt = filter === 'all' 
                ? artworksData 
                : artworksData.filter(art => art.category === filter);

            const categories = ['all', ...new Set(artworksData.map(art => art.category))];

            return (
                <div className="art-page">
                <div className="art-header">
                    <h1 className="art-title">Visual Work</h1>
                    <p className="art-subtitle">Digital Art Portfolio</p>
                </div>

                <div className="filter-container">
                    {categories.map(cat => (
                    <button
                        key={cat}
                        onClick={() => setFilter(cat)}
                        className={`filter-btn ${filter === cat ? 'active' : ''}`}
                    >
                        {cat}
                    </button>
                    ))}
                </div>

                <div className="art-gallery-grid">
                    {filteredArt.map(artwork => (
                    <div 
                        key={artwork.id} 
                        className="art-detail-card"
                        onClick={() => setSelectedArt(artwork)}
                    >
                        <img src={artwork.imageUrl} alt={artwork.title} />
                        <div className="art-card-info">
                        <h3 className="art-card-title">{artwork.title}</h3>
                        <p className="art-card-desc">{artwork.description}</p>
                        <span className="art-card-category">{artwork.category}</span>
                        </div>
                    </div>
                    ))}
                </div>

                {selectedArt && (
                    <Lightbox artwork={selectedArt} onClose={() => setSelectedArt(null)} />
                )}
                </div>
            );
        };

        const Lightbox = ({ artwork, onClose }) => {
            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => {
                document.body.style.overflow = 'unset';
                };
            }, []);

            return (
                <div className="lightbox" onClick={onClose}>
                <div className="lightbox-content" onClick={(e) => e.stopPropagation()}>
                    <button className="lightbox-close" onClick={onClose}>×</button>
                    <img src={artwork.imageUrl} alt={artwork.title} />
                    <div className="lightbox-info">
                    <h2 className="lightbox-title">{artwork.title}</h2>
                    <p className="lightbox-desc">{artwork.description} • {artwork.year}</p>
                    </div>
                </div>
                </div>
            );
        };

        const Contact = () => {
            return (
                <section id="contact" className="contact">
                <div className="tape tape-1"></div>
                
                <div className="about-grid">
                    <div>
                    <div className="section-label">Contact</div>
                    </div>
                    <div className="about-text">
                    <p>placeholder</p>
                    <p>placeholder</p>
                    </div>
                </div>
                
                <div className="tape tape-2"></div>
                </section>
            );
        };

        const App = () => {
            const [isDark, setIsDark] = useState(false);
            const [currentPage, setCurrentPage] = useState('home');

            const toggleDarkMode = () => {
                setIsDark(!isDark);
                document.body.classList.toggle('dark');
            };

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [currentPage]);

            return (
                <div className="canvas">
                <DarkModeToggle isDark={isDark} toggle={toggleDarkMode} />
                <Navigation currentPage={currentPage} setCurrentPage={setCurrentPage} />
                
                {currentPage === 'home' ? (
                    <>
                    <Info />
                    <About />
                    <Projects />
                    <Contact />
                    </>
                ) : (
                    <ArtPage />
                )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
    </script>

</body>
</html>
